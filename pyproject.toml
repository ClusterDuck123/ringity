# ---------------------------- BUILD-SYSTEM ---------------------------- #

[build-system]
requires = ["setuptools>=60", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

# ------------------------------ PROJECT ------------------------------ #

[project]
dependencies = [
    "matplotlib",
    "numba",
    "networkx",
    "scipy",
    "pandas",
    "ripser",     # MAKE CONDITIONAL
]
name = "ringity"
dynamic = ["version"]
authors = [
    { name = "Markus K. Youssef", email = "mk.youssef@hotmail.com" },
    { name = "Joel Hancock", email = "joel@lbi-netmed.com" },
]
description = "Calculates ring scores for various data structures"
requires-python = ">=3.8"
readme = { file = "README.rst", content-type = "text/x-rst" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
keywords = ["network", "ring-structure", "tda"]
license = "MIT"
license-files = ["LICENSE.txt"]

[project.urls]
Homepage = "https://github.com/ClusterDuck123/ringity"
Issues = "https://github.com/ClusterDuck123/ringity/issues"

[project.optional-dependencies]
giotto-tda = ["giotto-tda"]
plotting = ["plotly"]

# -------------------------------- TOOL -------------------------------- #

[tool.setuptools_scm]
write_to = "src/ringity/_version.py"

[tool.setuptools.packages.find]
where = ["src", "tests"]
include = ["*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.txt", "*.rst", "*.py"] # maybe we need to include tests somehow
"ringity" = ["data/*.csv"]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# -------------------------------- RUFF -------------------------------- #

[tool.ruff]
target-version = "py38"
line-length = 88
# _version.py is generated by setuptools-scm; _legacy is frozen legacy code.
extend-exclude = ["src/ringity/_version.py", "src/ringity/_legacy"]

[tool.ruff.lint]
# Pyflakes (F) + the black-compatible pycodestyle subset (E4/E7/E9).
# Line-length & whitespace (E1/E2/E5/W) are left to black and the whitespace hooks.
select = ["E4", "E7", "E9", "F"]
# `I` (integrals) and `l` (response length) are idiomatic math notation here.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# __init__.py modules re-export the public API: imported-but-unused (F401)
# and imports placed after runtime setup (E402) are intentional there.
"__init__.py" = ["F401", "E402"]
